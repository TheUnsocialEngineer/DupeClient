# Gradle JVM
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod metadata (published jar: dupeclient-<mod_version>+<version_suffix>.jar)
mod_version=1.48.1
maven_group=com.dupeclient
archives_base_name=dupeclient

# Minecraft 1.21.11 — this branch targets one MC version only (see branch 1.21.10 / 26.1)
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.4
loader_version=0.18.4
fabric_api_version=0.139.5+1.21.11
modmenu_version=16.0.0
minecraft_version_range=>=1.21.11 <1.21.12
version_suffix=1.21.11
java_version=21
mc_sources_variant=default
baritone_version=1.21.10-SNAPSHOT

# Build behavior
skipVersionBump=true

# Compile-time presence API base
presenceApiBase=https://dupeclient-presence.vercel.app/api/client/presence
# Shared HMAC secret for roster signature verification (override via -PpresenceStaffHmac=...)
presenceStaffHmac=dupeclient-presence-staff-hmac-v1-change-in-prod
