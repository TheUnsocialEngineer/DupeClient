# Gradle JVM
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod metadata (published jar name: dupeclient-<mod_version>+<mc>.jar)
mod_version=1.48.1
maven_group=com.dupeclient
archives_base_name=dupeclient

# Default Minecraft profile for ./gradlew build (see build.gradle profiles)
# Valid: mc12110, mc12111, mc261
mcTarget=mc12111

# Build behavior
# skipVersionBump=true keeps mod_version stable unless you pass -PautoVersionBump=true
skipVersionBump=true

# Compile-time presence API base (override at build time with -PpresenceApiBase=...)
presenceApiBase=https://dupeclient-presence.vercel.app/api/client/presence
