plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

def minecraftVersion = project.minecraft_version.toString()
def loaderVersion = project.loader_version.toString()
def fabricApiVersion = project.fabric_api_version.toString()
def modmenuVersion = project.modmenu_version.toString()
def minecraftVersionRange = project.minecraft_version_range.toString()
def versionSuffix = project.version_suffix.toString()
def javaRelease = Integer.parseInt(project.java_version.toString())

sourceSets.main.java.srcDir("src/macrocycling-default/java")
sourceSets.main.java.srcDir("src/screenshot-bootstrap-default/java")
sourceSets.main.java.srcDir("src/gui-default/java")
sourceSets.main.java.srcDir("src/waypoint-default/java")

def generatedBuildConstantsDir = layout.buildDirectory.dir("generated/build-constants")
sourceSets.main.java.srcDir(generatedBuildConstantsDir)

def resolvedPresenceApiBase = (findProperty("presenceApiBase") ?: findProperty("presence_api_base") ?: "https://dupeclient-presence.vercel.app/api/client/presence").toString().trim()
while (resolvedPresenceApiBase.endsWith("/")) {
    resolvedPresenceApiBase = resolvedPresenceApiBase.substring(0, resolvedPresenceApiBase.length() - 1)
}

def skipVersionBump = (findProperty("skipVersionBump") ?: "true").toString() == "true"
def autoVersionBump = (findProperty("autoVersionBump") ?: "false").toString() == "true"
def isVersionBumpTask = gradle.startParameter.taskNames.any { name ->
    def n = name.contains(":") ? name.substring(name.lastIndexOf(":") + 1) : name
    n == "build" || n == "assemble"
}

static String bumpModVersionByTenth(String current) {
    def parts = current.trim().split("\\.")
    if (parts.length >= 2) {
        def major = parts[0]
        def minor = Integer.parseInt(parts[1]) + 1
        if (parts.length >= 3) {
            return "${major}.${minor}.${parts[2]}"
        }
        return "${major}.${minor}"
    }
    return new BigDecimal(current.trim()).add(new BigDecimal("0.1")).stripTrailingZeros().toPlainString()
}

static void persistModVersion(Project project, String nextVersion) {
    def propsFile = project.layout.projectDirectory.file("gradle.properties").asFile
    def text = propsFile.getText("UTF-8")
    propsFile.setText(text.replaceFirst(/(?m)^mod_version=.*/, "mod_version=${nextVersion}"), "UTF-8")
    project.ext.mod_version = nextVersion
}

def resolvedModVersion = project.mod_version.toString()
if (isVersionBumpTask && autoVersionBump && !skipVersionBump) {
    def previous = resolvedModVersion
    def bumped = bumpModVersionByTenth(previous)
    persistModVersion(project, bumped)
    resolvedModVersion = bumped
    logger.lifecycle("Mod version bumped: {} -> {}", previous, bumped)
}

tasks.register("generateBuildConstants") {
    group = "build"
    description = "Generate compile-time constants (presence API base, mod version, build tag)"
    inputs.property("presenceApiBase", resolvedPresenceApiBase)
    inputs.property("modVersion", resolvedModVersion)
    outputs.file(generatedBuildConstantsDir.map { it.file("com/dupeclient/DupeBuildConstants.java") })

    doLast {
        def escapedApi = resolvedPresenceApiBase.replace("\\", "\\\\").replace("\"", "\\\"")
        def escapedVersion = resolvedModVersion.replace("\\", "\\\\").replace("\"", "\\\"")
        def buildDate = java.time.LocalDate.now(java.time.ZoneOffset.UTC).toString()
        def buildTag = "dc-${buildDate}-v${resolvedModVersion}"
        def escapedTag = buildTag.replace("\\", "\\\\").replace("\"", "\\\"")
        def outFile = generatedBuildConstantsDir.get().file("com/dupeclient/DupeBuildConstants.java").asFile
        outFile.parentFile.mkdirs()
        outFile.setText("""\
package com.dupeclient;

/** Generated by Gradle — do not edit. Override presence URL with -PpresenceApiBase=... */
public final class DupeBuildConstants {
    public static final String PRESENCE_API_BASE = "${escapedApi}";
    public static final String MOD_VERSION = "${escapedVersion}";
    public static final String BUILD_TAG = "${escapedTag}";

    private DupeBuildConstants() {
    }
}
""", "UTF-8")
    }
}

def dupedbApiSrcDir = layout.buildDirectory.dir("generated/dupedb-api-src")

tasks.register("prepareDupedbApiSources", Sync) {
    group = "build"
    from configurations.dupedbApiSources.collect { zipTree(it) }
    include "com/**"
    exclude "**/module-info.java"
    into dupedbApiSrcDir
    outputs.dir dupedbApiSrcDir

    doLast {
        def oauthFlow = dupedbApiSrcDir.get().file("com/dupedb/api/auth/OAuthFlow.java").asFile
        if (!oauthFlow.exists()) {
            throw new GradleException("DupeDB OAuthFlow.java missing after unpack")
        }
        def text = oauthFlow.getText("UTF-8")
        text = text.replace(
                'final String redirectUri = "http://127.0.0.1:" + resolvedPort + "/callback";',
                'final String redirectUri = "http://localhost:" + resolvedPort + "/dupedb-callback";'
        )
        text = text.replace(
                'server.createContext("/callback",',
                'server.createContext("/dupedb-callback",'
        )
        text = text.replace(
                '''    public Credentials authenticateAndExchange() throws OAuthException {
        if (!Desktop.isDesktopSupported()) {
            throw new OAuthException("Desktop browser not available — cannot complete OAuth flow");
        }

        String verifier = PkceUtil.generateCodeVerifier();''',
                '''    @FunctionalInterface
    public interface BrowserOpener {
        void open(String url) throws IOException;
    }

    private static volatile BrowserOpener browserOpener;

    public static void setBrowserOpener(BrowserOpener opener) {
        browserOpener = opener;
    }

    public Credentials authenticateAndExchange() throws OAuthException {
        String verifier = PkceUtil.generateCodeVerifier();'''
        )
        text = text.replace(
                '            Desktop.getDesktop().browse(URI.create(authorizeUrl));',
                '            openAuthorizeUrl(authorizeUrl);'
        )
        text = text.replace(
                '    static String parseParam(String query, String name) {',
                '''    private static void openAuthorizeUrl(String url) throws IOException {
        if (browserOpener != null) {
            browserOpener.open(url);
            return;
        }
        if (Desktop.isDesktopSupported() && Desktop.getDesktop().isSupported(Desktop.Action.BROWSE)) {
            Desktop.getDesktop().browse(URI.create(url));
            return;
        }
        String os = System.getProperty("os.name", "").toLowerCase(java.util.Locale.ROOT);
        ProcessBuilder pb;
        if (os.contains("win")) {
            pb = new ProcessBuilder("rundll32", "url.dll,FileProtocolHandler", url);
        } else if (os.contains("mac")) {
            pb = new ProcessBuilder("open", url);
        } else {
            pb = new ProcessBuilder("xdg-open", url);
        }
        pb.start();
    }

    static String parseParam(String query, String name) {'''
        )
        oauthFlow.setText(text, "UTF-8")
    }
}

sourceSets.main.java.srcDir dupedbApiSrcDir

tasks.named("compileJava").configure {
    dependsOn tasks.named("generateBuildConstants")
    dependsOn tasks.named("prepareDupedbApiSources")
}

version = "${resolvedModVersion}+${versionSuffix}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.bawnorton.com/releases" }
}

def dupedbApiVersion = "1.0.4"

configurations {
    dupedbApiSources
}

dependencies {
    dupedbApiSources "com.github.DupeDB:java-api:${dupedbApiVersion}:sources"
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${loaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    compileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
    annotationProcessor "com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.2-beta.4"
    compileOnly "com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.2-beta.4"
    compileOnly "io.netty:netty-handler-proxy:4.1.118.Final"
    implementation include("org.xerial:sqlite-jdbc:3.47.2.0")
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraftVersion
    inputs.property "minecraft_version_range", minecraftVersionRange
    inputs.property "loader_version", loaderVersion

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_version": minecraftVersion,
                "minecraft_version_range": minecraftVersionRange,
                "loader_version": loaderVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaRelease
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaRelease)
    }
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
}

loom {
    accessWidenerPath = file("src/main/resources/ui_utils.accesswidener")
    mixin {
        defaultRefmapName = "${project.archives_base_name}-refmap.json"
    }
}

tasks.named('sourcesJar') {
    dependsOn 'generateBuildConstants', 'prepareDupedbApiSources'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
