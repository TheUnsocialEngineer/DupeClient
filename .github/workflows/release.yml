name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: 1.21.10
            java: "21"
          - branch: 1.21.11
            java: "21"
          - branch: 26.1
            java: "25"
          - branch: 26.2
            java: "25"
    steps:
      - name: Checkout version branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -PskipVersionBump=true --no-daemon

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.branch }}
          path: build/libs/dupeclient-*.jar
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all jars
        uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: jars/**/*.jar
          generate_release_notes: true
