name: Build

on:
  push:
    branches: [main, 1.21.10, 1.21.11, 26.1]
  pull_request:
    branches: [main, 1.21.10, 1.21.11, 26.1]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Java version
        id: java
        run: |
          if [ "${{ github.ref_name }}" = "26.1" ]; then
            echo "version=25" >> "$GITHUB_OUTPUT"
          else
            echo "version=21" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -PskipVersionBump=true --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: dupeclient-${{ github.ref_name }}
          path: build/libs/dupeclient-*.jar
          if-no-files-found: error
